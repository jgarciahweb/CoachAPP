<div class="bg-[#0a1628] flex items-center justify-center p-6">

  <!-- Fondo decorativo -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full
                bg-[#7fd11b]/5 blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full
                bg-[#7fd11b]/5 blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full
                bg-[#1e3a5f]/20 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-black uppercase tracking-tight text-white
                 [font-family:'Barlow_Condensed',sans-serif]">
        Coach<span class="text-[#7fd11b]">APP</span>
      </h1>
      <p class="text-xs tracking-[0.3em] uppercase text-[#3d6a9e] mt-1">
        Gestiona · Planifica · Mejora
      </p>
    </div>

    <!-- Card -->
    <div class="bg-[#0f2040] border border-[#1e3a5f] rounded-2xl p-8
                shadow-[0_24px_64px_rgba(0,0,0,0.4)]">

      <h2 class="text-xl font-black uppercase tracking-tight text-white mb-6
                 [font-family:'Barlow_Condensed',sans-serif]">
        Iniciar sesión
      </h2>

      <!-- Error global -->
      @if(errorMessage) {
      <div class="flex items-center gap-3 px-4 py-3 rounded-lg mb-6
                  bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        {{ errorMessage }}
      </div>
      }

      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" novalidate class="space-y-5">

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold uppercase tracking-widest text-[#7a9cc4]">
            Email
          </label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[#3d6a9e] pointer-events-none"
                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input
              type="email"
              formControlName="email"
              placeholder="entrenador@coachapp.com"
              class="w-full pl-10 pr-4 py-3 rounded-lg text-sm text-white placeholder-[#3d6a9e]
                     bg-[#162d50] border transition-all duration-200 outline-none
                     focus:shadow-[0_0_0_3px_rgba(127,209,27,0.1)]"
              [class.border-[#1e3a5f]]="!isFieldInvalid('email')"
              [class.focus:border-[#7fd11b]]="!isFieldInvalid('email')"
              [class.border-red-500]="isFieldInvalid('email')"
            />
          </div>
          @if(isFieldInvalid('email')) {
          <p class="text-xs text-red-400 flex items-center gap-1">
            <span>·</span> {{ getFieldError('email') }}
          </p>
          }
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold uppercase tracking-widest text-[#7a9cc4]">
            Contraseña
          </label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[#3d6a9e] pointer-events-none"
                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="w-full pl-10 pr-11 py-3 rounded-lg text-sm text-white placeholder-[#3d6a9e]
                     bg-[#162d50] border transition-all duration-200 outline-none
                     focus:shadow-[0_0_0_3px_rgba(127,209,27,0.1)]"
              [class.border-[#1e3a5f]]="!isFieldInvalid('password')"
              [class.focus:border-[#7fd11b]]="!isFieldInvalid('password')"
              [class.border-red-500]="isFieldInvalid('password')"
            />
            <!-- Toggle visibilidad -->
            <button type="button" (click)="showPassword = !showPassword"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#3d6a9e]
                           hover:text-[#7fd11b] transition-colors">
              @if(showPassword) {
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
              </svg>
              } @else {
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              }
            </button>
          </div>
          @if(isFieldInvalid('password')) {
          <p class="text-xs text-red-400 flex items-center gap-1">
            <span>·</span> {{ getFieldError('password') }}
          </p>
          }
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full flex items-center justify-center gap-2 py-3 rounded-lg
                 font-bold text-sm uppercase tracking-widest
                 bg-[#7fd11b] text-[#0a1628]
                 hover:bg-[#9aed2f] hover:shadow-[0_0_24px_rgba(127,209,27,0.4)]
                 active:scale-95 transition-all duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
          @if(isLoading) {
          <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
          Entrando...
          } @else {
          Entrar
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
          }
        </button>

      </form>
    </div>

    <!-- Registro -->
    <p class="text-center text-xs text-[#3d6a9e] mt-6">
      ¿No tienes cuenta?
      <a routerLink="/registro"
         class="text-[#7fd11b] font-semibold hover:underline transition-all">
        Regístrate
      </a>
    </p>

  </div>
</div>
