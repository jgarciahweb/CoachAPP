<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Equipos</h1>

  @for(team of teams; track team.id){

  <div class="border rounded p-4 mb-4">
    <h2 class="text-3xl font-bold text-amber-400 underline">
      {{ team.name }}
    </h2>

    <ul>
      @for(category of team.categories; track category.id){
      <li>
        {{ category.name }}
      </li>
      }
    </ul>
  </div>
  }
</div>
