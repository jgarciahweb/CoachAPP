@if(user) {
  <!-- Usuario autenticado -->
  <div class="relative group/user">
    <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg
                   bg-[#0f2040] border border-[#1e3a5f]
                   hover:border-[#7fd11b]/50 transition-all duration-200">

      <!-- Avatar -->
      @if(user.avatar) {
        <img [src]="user.avatar" [alt]="user.name"
             class="w-6 h-6 rounded-full object-cover ring-1 ring-[#7fd11b]/40"/>
      } @else {
        <div class="w-6 h-6 rounded-full bg-[#7fd11b] flex items-center justify-center flex-shrink-0">
          <span class="text-[#0a1628] text-xs font-black">
            {{ user.name?.charAt(0)?.toUpperCase() }}
          </span>
        </div>
      }

      <span class="text-xs font-semibold text-[#7a9cc4] group-hover/user:text-white
                   transition-colors hidden sm:block max-w-[120px] truncate">
        {{ user.name }}
      </span>

      <!-- Chevron -->
      <svg class="w-3 h-3 text-[#3d6a9e] hidden sm:block" xmlns="http://www.w3.org/2000/svg"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- Dropdown -->
    <div class="absolute right-0 top-full mt-2 w-44 rounded-lg overflow-hidden
                bg-[#0f2040] border border-[#1e3a5f]
                shadow-[0_8px_32px_rgba(0,0,0,0.4)]
                opacity-0 pointer-events-none translate-y-1
                group-hover/user:opacity-100 group-hover/user:pointer-events-auto group-hover/user:translate-y-0
                transition-all duration-200">

      <a routerLink="/perfil"
         class="flex items-center gap-2 px-4 py-2.5 text-xs font-semibold uppercase tracking-wider
                text-[#7a9cc4] hover:text-white hover:bg-[#1e3a5f] transition-all">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Mi perfil
      </a>

      <div class="border-t border-[#1e3a5f]"></div>

      <button (click)="logout()"
              class="w-full flex items-center gap-2 px-4 py-2.5 text-xs font-semibold uppercase tracking-wider
                     text-[#7a9cc4] hover:text-red-400 hover:bg-[#1e3a5f] transition-all">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </div>

} @else {
  <!-- Sin sesión -->
  <a routerLink="/login"
     class="flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-bold uppercase tracking-widest
            border border-[#7fd11b] text-[#7fd11b]
            hover:bg-[#7fd11b] hover:text-[#0a1628]
            hover:shadow-[0_0_20px_rgba(127,209,27,0.3)]
            active:scale-95 transition-all duration-200">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
    </svg>
    Iniciar sesión
  </a>
}
