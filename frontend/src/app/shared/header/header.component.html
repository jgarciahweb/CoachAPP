<header class="sticky top-0 z-50 bg-[#0a1628]/95 backdrop-blur-sm border-b border-[#1e3a5f]">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 group">
      <span class="text-xl font-black uppercase tracking-tight text-white
                   [font-family:'Barlow_Condensed',sans-serif]">
        Coach<span class="text-[#7fd11b]">APP</span>
      </span>
    </a>

    <!-- Nav desktop -->
    <nav class="hidden md:flex items-center gap-1">
      <a *ngFor="let item of navItems" [routerLink]="item.path"
        routerLinkActive="text-[#7fd11b] bg-[#7fd11b]/10"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold uppercase tracking-wider
               text-[#7a9cc4] hover:text-white hover:bg-[#1e3a5f]
               transition-all duration-200">
        {{ item.label }}
      </a>
    </nav>

    <!-- Acciones -->
    <div class="flex items-center gap-3">
      <!-- Avatar / usuario -->
      <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg
                     bg-[#0f2040] border border-[#1e3a5f]
                     hover:border-[#7fd11b]/50 transition-all duration-200 group">
        <div class="w-6 h-6 rounded-full bg-[#7fd11b] flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-[#0a1628]" xmlns="http://www.w3.org/2000/svg"
               fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <span class="text-xs font-semibold text-[#7a9cc4] group-hover:text-white transition-colors hidden sm:block">
          Entrenador
        </span>
      </button>

      <!-- Hamburger móvil -->
      <button (click)="toggleMenu()"
              class="md:hidden p-2 rounded-lg text-[#7a9cc4] hover:text-white hover:bg-[#1e3a5f] transition-all">
        @if(menuOpen) {
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        } @else {
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        }
      </button>
    </div>
  </div>

  <!-- Nav móvil -->
  <div *ngIf="menuOpen" class="md:hidden border-t border-[#1e3a5f] bg-[#0a1628] px-4 py-3 space-y-1">
    <a *ngFor="let item of navItems" [routerLink]="item.path"
      routerLinkActive="text-[#7fd11b] bg-[#7fd11b]/10"
      (click)="menuOpen = false"
      class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold uppercase tracking-wider
             text-[#7a9cc4] hover:text-white hover:bg-[#1e3a5f] transition-all duration-200">
      {{ item.label }}
    </a>
  </div>
</header>
